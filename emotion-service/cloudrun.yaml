apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: callertone-emotion
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 1
      timeoutSeconds: 900
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/callertone/emotion:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
          env:
            - name: PORT
              value: "8080"
            - name: EMOTION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: EMOTION_SERVICE_TOKEN
